<div class="hd"><div><div class="caps">Technical direction</div><div class="display" style="font-size:58px;color:var(--cobalt)">Who runs what, and what crosses the wire</div></div></div>

<rect x='0' y='0' width='676' height='600' rx='14' fill='#FAF6EC' stroke='#24459A' stroke-width='2' stroke-dasharray='6 5'/><text x='16' y='26' font-family='Courier Prime' font-size='12' font-weight='700' fill='#24459A'>HOST BROWSER TAB</text>
<rect x='848' y='0' width='656' height='600' rx='14' fill='#FAF6EC' stroke='#2F8F7A' stroke-width='2' stroke-dasharray='6 5'/><text x='864' y='26' font-family='Courier Prime' font-size='12' font-weight='700' fill='#2F8F7A'>EVERY OTHER PLAYER'S TAB (x7)</text>
<rect x='20' y='44' width='304' height='200' rx='10' fill='#E9EEF9' stroke='#24459A' stroke-width='1.6'/><text x='32' y='66' font-family='Fraunces' font-weight='800' font-size='17' fill='#24459A'>Sim worker (authoritative)</text><text x='32' y='84' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>sim/ : fixed 60 Hz tick, no DOM</text><text x='32' y='100' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>Rapier 2D deterministic (wasm)</text><text x='32' y='116' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>fighters, combat, gadgets, island</text><text x='32' y='132' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>input jitter buffer (2 ticks)</text><text x='32' y='148' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>12-tick hurtbox history (lag comp)</text><text x='32' y='164' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>out: snapshot 30 Hz, world 15 Hz,</text><text x='32' y='180' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>     events (hit, parry, ko, chunk)</text>
<rect x='352' y='44' width='304' height='200' rx='10' fill='#fff' stroke='#2B2623' stroke-width='1.6'/><text x='364' y='66' font-family='Fraunces' font-weight='800' font-size='17' fill='#2B2623'>Main thread</text><text x='364' y='84' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>input: keyboard + Gamepad API</text><text x='364' y='100' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>net relay: worker <-> channels</text><text x='364' y='116' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>render: three.js WebGLRenderer</text><text x='364' y='132' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>  interpolates between sim states</text><text x='364' y='148' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>vfx + audio driven by sim events</text><text x='364' y='164' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>ui: DOM overlay (base.css)</text><text x='364' y='180' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>the host is also its own client</text>
<rect x='20' y='284' width='304' height='130' rx='10' fill='#FFF7E3' stroke='#8a6a22' stroke-width='1.6'/><text x='32' y='306' font-family='Fraunces' font-weight='800' font-size='17' fill='#8a6a22'>Shared sim code</text><text x='32' y='324' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>one TypeScript package, 3 homes:</text><text x='32' y='340' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>host worker, client prediction,</text><text x='32' y='356' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>headless Node (bots, netsim, tests)</text><text x='32' y='372' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>seeded PRNG, integer ticks, no Date</text>
<rect x='352' y='284' width='304' height='130' rx='10' fill='#fff' stroke='#2B2623' stroke-width='1.6'/><text x='364' y='306' font-family='Fraunces' font-weight='800' font-size='17' fill='#2B2623'>Assets</text><text x='364' y='324' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>glTF (meshopt) from Blender scripts</text><text x='364' y='340' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>1 packed matcap PNG, 3 woff2 fonts</text><text x='364' y='356' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>1 Opus audio sprite + JSON map</text><text x='364' y='372' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>lobby pack first, arenas on demand</text>
<rect x='20' y='456' width='636' height='120' rx='10' fill='#F3EDE2' stroke='#2B2623' stroke-width='1.6'/><text x='32' y='478' font-family='Fraunces' font-weight='800' font-size='17' fill='#2B2623'>Trystero room (reliable, ordered)</text><text x='32' y='496' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>hello (protocol, build) / roster + scores as room state</text><text x='32' y='512' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>match events / chat / host hand-over</text><text x='32' y='528' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>host role verified with roles(); room code = signalling password</text>
<rect x='868' y='44' width='304' height='200' rx='10' fill='#fff' stroke='#2B2623' stroke-width='1.6'/><text x='880' y='66' font-family='Fraunces' font-weight='800' font-size='17' fill='#2B2623'>Main thread</text><text x='880' y='84' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>input -> 16-byte packet at 60 Hz</text><text x='880' y='100' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>  (tick + this and last 3 masks)</text><text x='880' y='116' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>prediction: own fighter only,</text><text x='880' y='132' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>  same sim code; reconcile on</text><text x='880' y='148' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>  every snapshot</text><text x='880' y='164' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>remote fighters and objects:</text><text x='880' y='180' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>  interpolated 66 ms behind</text>
<rect x='1184' y='44' width='300' height='200' rx='10' fill='#fff' stroke='#2B2623' stroke-width='1.6'/><text x='1196' y='66' font-family='Fraunces' font-weight='800' font-size='17' fill='#2B2623'>Local-only simulation</text><text x='1196' y='84' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>cosmetic shards, dust, chips,</text><text x='1196' y='100' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>trails. Never networked, never</text><text x='1196' y='116' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>affects rules. Seeded from</text><text x='1196' y='132' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>event ids so everyone sees</text><text x='1196' y='148' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>roughly the same mess.</text><text x='1196' y='164' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>budget (High): 300 shards,</text><text x='1196' y='180' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>250 puffs</text>
<rect x='868' y='284' width='616' height='150' rx='10' fill='#FFF7E3' stroke='#8a6a22' stroke-width='1.6'/><text x='880' y='306' font-family='Fraunces' font-weight='800' font-size='17' fill='#8a6a22'>What a client is allowed to decide</text><text x='880' y='324' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>Its own inputs, and how its own fighter LOOKS for a few frames. Nothing else.</text><text x='880' y='340' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>Hits, blocks, parries, grabs, launches, KOs, chunk states, spawns: host only.</text><text x='880' y='356' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>A hit is tested against where the attacker SAW the target</text><text x='880' y='372' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>  (rewound up to 8 ticks).</text><text x='880' y='388' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>Guard and parry are tested against what the defender is doing NOW,</text><text x='880' y='404' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>  widened by their latency (up to 3 ticks).</text>
<rect x='868' y='456' width='616' height='120' rx='10' fill='#F3EDE2' stroke='#2B2623' stroke-width='1.6'/><text x='880' y='478' font-family='Fraunces' font-weight='800' font-size='17' fill='#2B2623'>Trystero room (reliable, ordered)</text><text x='880' y='496' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>same room, same actions. The mesh already exists, so any peer</text><text x='880' y='512' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>can take over hosting between rounds.</text><text x='880' y='528' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>peer-connect-failed -> the friendly error screen + connectivity map</text>

<rect x='24' y='684' width='340' height='124' rx='10' fill='#fff' stroke='#8a6a22' stroke-width='1.6'/><text x='36' y='706' font-family='Fraunces' font-weight='800' font-size='17' fill='#8a6a22'>Bot matches</text><text x='36' y='724' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>8 bots, same sim package, same inputs</text><text x='36' y='740' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>a 2-minute match in about 5 s of CPU</text><text x='36' y='756' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>report: KOs by cause, lengths, loops</text>

<rect x='1140' y='684' width='340' height='124' rx='10' fill='#fff' stroke='#8a6a22' stroke-width='1.6'/><text x='1152' y='706' font-family='Fraunces' font-weight='800' font-size='17' fill='#8a6a22'>One real browser, last</text><text x='1152' y='724' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>Chrome headless, software WebGL</text><text x='1152' y='740' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>one smoke test, a few screenshots,</text><text x='1152' y='756' font-family='Courier Prime' font-size='11.5' fill='#2B2623'>one 10 s clip. Never in parallel.</text>
